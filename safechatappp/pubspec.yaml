name: safechatapp
description: "SafeChat - Telegram darajasidagi xavfsiz va zamonaviy messenjer"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase xizmatlari
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0

  # Tizim va UI komponentlari
  google_sign_in: ^6.2.1
  socket_io_client: ^3.1.4
  provider: ^6.1.2
  intl: ^0.19.0
  uuid: ^4.4.0
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.1
  image_picker: ^1.1.0
  file_picker: ^8.0.1
  flutter_spinkit: ^5.2.1
  google_fonts: ^6.2.1
  lottie: ^3.1.0
  flutter_chat_ui: ^1.6.11
  flutter_link_previewer: ^3.2.0
  video_player: ^2.8.1
  chewie: ^1.7.1
  font_awesome_flutter: ^10.7.0
  
  # Bildirishnomalar (Notifications)
  overlay_support: ^2.1.0      # <--- Versiya raqami to'g'irlandi
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4
  
  # Yordamchi paketlar
  url_launcher: ^6.3.0        
  path_provider: ^2.1.3       
  permission_handler: ^11.3.1 
  flutter_svg: ^2.0.10+1      

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# LAUNCHER ICONS SOZLAMALARI
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/google.png